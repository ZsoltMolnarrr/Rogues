[[dependencies.rogues]]
modId = "spell_engine"
mandatory = true
versionRange = "[1.10.5,)"
ordering = "AFTER"
side = "BOTH"

# StructurePoolAPI injects the rogue barracks into the *vanilla* village pools. Since 1.2.1 it has a
# Forge artifact, so this is a hard dependency on both loaders (mirrors the `fabric.mod.json` entry).
[[dependencies.rogues]]
modId = "structure_pool_api"
mandatory = true
versionRange = "[1.2.1,)"
ordering = "NONE"
side = "BOTH"

# Mixin configs are declared in the jar MANIFEST (`MixinConfigs:`) by Loom (`loom.forge.mixinConfig`),
# not in this file — the `[[mixins]]` table is NeoForge-only.
